<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Personal Planner</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Personal Planner</h1>

        <section>
            <h2>Today's Plan</h2>

            <div class="stats">
                <div class="stat-card totalDiv">
                    <p>Total tasks</p>
                    <span id="totalTasks">0</span>
                </div>

                <div class="stat-card completedDiv">
                    <p>Completed</p>
                    <span id="completedTasks">0</span>
                </div>

                <div class="stat-card pendingDiv">
                    <p>Pending</p>
                    <span id="pendingTasks">0</span>
                </div>
            </div>

            <div class="filter-toolbar">
                <div class="task-filters" role="group" aria-label="Filter by status">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="pending">Pending</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>

                <div class="toolbar-divider" aria-hidden="true"></div>

                <div class="toolbar-group">
                    <span class="toolbar-icon" aria-hidden="true">⚑</span>
                    <label for="priorityFilter">Filter by priority</label>
                    <select id="priorityFilter">
                        <option value="all">All priorities</option>
                        <option value="high">High priority</option>
                        <option value="medium">Medium priority</option>
                        <option value="low">Low priority</option>
                    </select>
                </div>

                <div class="toolbar-group">
                    <span class="toolbar-icon" aria-hidden="true">⇅</span>
                    <label for="sortTasks">Sort tasks</label>
                    <select id="sortTasks">
                        <option value="default">Default order</option>
                        <option value="priority-desc">High to Low Priority</option>
                        <option value="priority-asc">Low to High Priority</option>
                    </select>
                </div>
            </div>

            <input
                type="search"
                id="searchTasks"
                placeholder="Search tasks..."
                aria-label="Search tasks"
            />

            <div id="output"></div>

            <p id="emptyMessage" class="empty-message" hidden></p>

            <div class="task-form">
                <input
                    id="taskInput"
                    type="text"
                    placeholder="Add task..."
                    aria-label="New task"
                >
                <label class="repeat-option" for="repeatDaily">
                    <input type="checkbox" id="repeatDaily">
                    <span>Repeat every day</span>
                </label>
                <select id="taskPriority" aria-label="Task priority">
                    <option value="low">Low Priority</option>
                    <option value="medium" selected>Medium Priority</option>
                    <option value="high">High Priority</option>
                </select>
                <button id="addTasks">Add Task</button>
            </div>
        </section>

        <section>
            <h2>Journal</h2>
            <h3>Journal entry</h3>
            <div class="journal-nav">
                <button id="prevDay" aria-label="Previous day">←</button>
                <input type="date" id="journalDate" aria-label="Journal date">
                <button id="nextDay" aria-label="Next day">→</button>
                <button id="todayBtn">Today</button>
            </div>
            <textarea id="journal" name="msg" rows="10" aria-label="Today's journal"></textarea>
        </section>
        
        <dialog id="deleteDialog" class="confirm-dialog" aria-labelledby="deleteDialogTitle">
            <form method="dialog">
                <h3 id="deleteDialogTitle">Delete repeating task</h3>
                <p id="deleteDialogText"></p>
                <div class="dialog-actions">
                    <button value="cancel" class="dialog-keep" autofocus>Keep task</button>
                    <button value="today" class="dialog-today">Delete today only</button>
                    <button value="series" class="dialog-series">Delete entire series</button>
                </div>
            </form>
        </dialog>

        <script src="script.js"></script>
    </body>
</html>
