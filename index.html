<!DOCTYPE html>
<html>

    <head>
        <title>
            Personal Planner
        </title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1>Personal Planner</h1>

        <section>
            <h2>Today's Plan</h2>
            <div id="output"></div>
            <input id="taskInput" type="text" name="task" placeholder="Add Task">
            <button id="addTasks">Add Task</button>
        </section>
        <select id="taskPriority">
            <option value="low">Low Priority</option>
            <option value="medium" selected>Medium Priority</option>
            <option value="high">High Priority</option>
        </select>

        <section>
            <h2>Journal</h2>
            <h3>Today's Journal</h3>
            <textarea id="journal" name="msg" rows="10" cols="100"></textarea>
        </section>
        <script src="script.js"></script>
    </body>
</html>
